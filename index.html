<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽卡认字</title>
    <!-- PWA 配置 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3f51b5">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2232/2232688.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }
        header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 1.8rem;
            color: #1a237e;
            margin-bottom: 8px;
        }
        .stats {
            font-size: 0.9rem;
            color: #666;
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 8px;
        }
        /* 错字重练提示与进度条 */
        .relearn-banner {
            display: none;
            color: #f44336;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 8px;
            text-align: center;
        }
        .progress-container {
            display: none;
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 8px;
            height: 10px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-bar {
            height: 100%;
            background-color: #f44336;
            width: 0%;
            transition: width 0.3s ease;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            height: 320px;
            perspective: 1000px;
            margin-bottom: 20px;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            border-radius: 16px;
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }
        .card-front {
            border: 2px solid #3f51b5;
        }
        .card-back {
            transform: rotateY(180deg);
            background: #fafafa;
            border: 2px solid #4caf50;
        }
        .char {
            font-size: 5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 12px;
        }
        .hint {
            font-size: 0.85rem;
            color: #999;
        }
        
        /* 背面样式调整：顶部显示错题记录，下方换行显示例句 */
        .history-record {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 16px;
            width: 100%;
        }
        .stat-correct { color: #4caf50; }
        .stat-wrong { color: #f44336; }

        .context-sentence {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #333;
            word-break: break-all;
        }
        .highlight {
            color: #e91e63;
            font-weight: bold;
            font-size: 1.4rem;
            text-decoration: underline;
        }
        .btn-group {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 400px;
        }
        button {
            flex: 1;
            padding: 14px 0;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-know {
            background-color: #4caf50;
            color: white;
        }
        .btn-know:hover { background-color: #43a047; }
        .btn-forget {
            background-color: #f44336;
            color: white;
        }
        .btn-forget:hover { background-color: #e53935; }
        .btn-restart {
            background-color: #3f51b5;
            color: white;
            margin-top: 15px;
            padding: 12px 24px;
            font-size: 1rem;
        }
        .loading {
            font-size: 1.2rem;
            color: #666;
            margin-top: 100px;
        }
        .finish-box {
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>抽卡认字</h1>
        <div class="stats">
            <span>总字数: <strong id="total-count">0</strong></span>
            <span>待复习: <strong id="review-count">0</strong></span>
        </div>
        <!-- 错字重练模式提示与进度条 -->
        <div id="relearn-banner" class="relearn-banner">⚠️ 错字重练环节</div>
        <div id="progress-container" class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
    </header>

    <div id="app" class="loading">正在加载文本数据...</div>

    <script>
        // 原始解析出的完整卡片池
        let rawCardsPool = [];
        // 当前练习队列
        let cards = [];
        let currentIndex = 0;

        // 错字重练状态控制
        let isRelearnMode = false;
        let relearnTotal = 0; // 重练模式初始错字总量

        // 初始化加载数据
        async function init() {
            try {
                const response = await fetch('./lunyu.txt');
                if (!response.ok) throw new Error('无法读取文本文件');
                const text = await response.text();
                
                processText(text);
                if (rawCardsPool.length === 0) {
                    document.getElementById('app').innerHTML = '文本解析为空，请检查文件。';
                    return;
                }
                
                startNewSession();
            } catch (err) {
                console.error(err);
                document.getElementById('app').innerHTML = '加载失败，请确保本地已放置 lunyu.txt。';
            }
        }

        // 解析文本并构建基础抽卡数据
        function processText(text) {
            const rawSentences = text.split(/[。！？；\n\r]/);
            const cleanSentences = rawSentences
                .map(s => s.trim().replace(/[^\u4e00-\u9fa5]/g, ''))
                .filter(s => s.length > 0);

            const cardMap = new Map();

            cleanSentences.forEach(sentence => {
                for (let char of sentence) {
                    if (!cardMap.has(char)) {
                        cardMap.set(char, {
                            char: char,
                            sentences: [sentence]
                        });
                    } else {
                        const data = cardMap.get(char);
                        if (data.sentences.length < 3 && !data.sentences.includes(sentence)) {
                            data.sentences.push(sentence);
                        }
                    }
                }
            });

            rawCardsPool = Array.from(cardMap.values());
        }

        // 开启全新一轮练习 (重置所有答题记录)
        function startNewSession() {
            // 深拷贝卡片数据，重置答题正确/错误计数
            cards = rawCardsPool.map(item => ({
                ...item,
                correctCount: 0,
                wrongCount: 0
            }));

            // 洗牌算法
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }

            currentIndex = 0;
            isRelearnMode = false;
            relearnTotal = 0;

            // 重置 UI 提示
            document.getElementById('relearn-banner').style.display = 'none';
            document.getElementById('progress-container').style.display = 'none';
            document.getElementById('total-count').textContent = cards.length;
            
            renderCardUI();
            showNextCard();
        }

        // 渲染基础结构
        function renderCardUI() {
            const app = document.getElementById('app');
            app.className = '';
            app.innerHTML = `
                <div class="card-container">
                    <div class="card" id="card" onclick="flipCard()">
                        <div class="card-face card-front">
                            <div class="char" id="card-char">-</div>
                            <div class="hint">点击卡片翻面查看释义与例句</div>
                        </div>
                        <div class="card-face card-back">
                            <!-- 需求4：第一行显示正确/错误记录 -->
                            <div class="history-record">
                                正确：<span class="stat-correct" id="card-correct">0</span> ，错误：<span class="stat-wrong" id="card-wrong">0</span>
                            </div>
                            <!-- 换行显示例句内容 -->
                            <div class="context-sentence" id="card-sentence"></div>
                        </div>
                    </div>
                </div>
                <!-- 需求2：认识与不认识互换位置（认识在左，不认识在右） -->
                <div class="btn-group">
                    <button class="btn-know" onclick="handleResult(true)">认识</button>
                    <button class="btn-forget" onclick="handleResult(false)">不认识</button>
                </div>
            `;
        }

        // 翻转卡片
        function flipCard() {
            const card = document.getElementById('card');
            card.classList.toggle('flipped');
        }

        // 显示下一张卡片及更新进度
        function showNextCard() {
            // 练习完毕后的处理
            if (cards.length === 0) {
                document.getElementById('relearn-banner').style.display = 'none';
                document.getElementById('progress-container').style.display = 'none';
                document.getElementById('review-count').textContent = 0;
                
                // 需求3：再练一次将重置并重新开始
                document.getElementById('app').innerHTML = `
                    <div class="finish-box">
                        <h2>🎉 恭喜！已完成所有汉字练习</h2>
                        <button class="btn-restart" onclick="startNewSession()">再练一次</button>
                    </div>
                `;
                return;
            }

            // 获取当前卡片
            const currentCard = cards[currentIndex % cards.length];
            const cardEl = document.getElementById('card');
            
            // 确保翻回正面
            cardEl.classList.remove('flipped');

            setTimeout(() => {
                document.getElementById('card-char').textContent = currentCard.char;
                document.getElementById('card-correct').textContent = currentCard.correctCount;
                document.getElementById('card-wrong').textContent = currentCard.wrongCount;
                
                // 处理例句高亮
                const rawSentence = currentCard.sentences[0] || '';
                const highlightedSentence = rawSentence.replace(
                    new RegExp(currentCard.char, 'g'),
                    `<span class="highlight">${currentCard.char}</span>`
                );
                document.getElementById('card-sentence').innerHTML = `“${highlightedSentence}”`;
            }, cardEl.classList.contains('flipped') ? 300 : 0);

            document.getElementById('review-count').textContent = cards.length;

            // 更新错字重练模式下的进度条
            if (isRelearnMode && relearnTotal > 0) {
                const completed = relearnTotal - cards.length;
                const percent = Math.max(0, Math.min(100, (completed / relearnTotal) * 100));
                document.getElementById('progress-bar').style.width = percent + '%';
            }
        }

        // 处理认识/不认识逻辑
        function handleResult(known) {
            if (cards.length === 0) return;

            const currentCard = cards[currentIndex % cards.length];

            if (known) {
                // 答对：更新计数并移除出当前队列
                currentCard.correctCount++;
                cards.splice(currentIndex % cards.length, 1);
            } else {
                // 答错：更新计数并移到队列靠后位置
                currentCard.wrongCount++;
                currentIndex++;
            }

            // 检查常规练习是否刚好结束，自动启动需求1：错字重练环节
            if (!isRelearnMode && cards.length === 0) {
                // 从初始池中筛选出有过错误记录的字
                const wrongCards = rawCardsPool.filter(c => c.wrongCount > 0);
                if (wrongCards.length > 0) {
                    isRelearnMode = true;
                    cards = wrongCards;
                    relearnTotal = cards.length;

                    // 显示红色字样与进度条
                    document.getElementById('relearn-banner').style.display = 'block';
                    document.getElementById('progress-container').style.display = 'block';
                    document.getElementById('progress-bar').style.width = '0%';
                }
            }

            if (cards.length > 0) {
                currentIndex = currentIndex % cards.length;
            }
            showNextCard();
        }

        // 初始化调用
        init();

        // -------------------------------------------------------------
        // Service Worker 自动注册与后台更新拦截逻辑
        // -------------------------------------------------------------
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((registration) => {
                    console.log('SW Registered:', registration);

                    registration.onupdatefound = () => {
                        const installingWorker = registration.installing;
                        if (installingWorker == null) return;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed') {
                                if (navigator.serviceWorker.controller) {
                                    console.log('检测到新版本，准备自动更新刷新...');
                                    window.location.reload();
                                }
                            }
                        };
                    };
                }).catch((err) => {
                    console.error('SW Registration Failed:', err);
                });
            });

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }
    </script>
</body>
</html>
