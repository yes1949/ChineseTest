<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>论语背诵练习</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: #333;
        }

        /* 主容器 */
        .app-card {
            width: 100%;
            max-width: 900px;
            min-height: 85vh;
            height: 85vh;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 页面切换 */
        .page {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100%;
            width: 100%;
            padding: 24px;
            overflow: hidden;
        }

        .page.active {
            display: flex;
        }

        /* 第一页：选择页样式 */
        .page-title {
            font-size: clamp(20px, 4vw, 26px);
            font-weight: bold;
            color: #1a237e;
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 2px solid #e8eaf6;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .tree-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
            margin-bottom: 16px;
        }

        /* 可折叠层级样式 */
        .book-item {
            margin-bottom: 12px;
        }

        .book-header {
            display: flex;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
            padding: 8px 12px;
            background-color: #e8eaf6;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            user-select: none;
        }

        .toggle-icon {
            display: inline-block;
            width: 20px;
            text-align: center;
            margin-right: 6px;
            font-size: 0.8rem;
            transition: transform 0.2s ease;
            color: #5c6bc0;
        }

        .chapter-list {
            display: block;
        }

        .chapter-item {
            margin-left: 16px;
            margin-bottom: 8px;
            border-left: 2px solid #c5cae9;
            padding-left: 12px;
        }

        .chapter-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #3949ab;
            cursor: pointer;
            padding: 6px 0;
            user-select: none;
        }

        .paragraph-list {
            margin-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }

        /* 折叠隐藏类 */
        .collapsed {
            display: none !important;
        }

        .paragraph-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 0.95rem;
            color: #555;
            cursor: pointer;
            line-height: 1.5;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .paragraph-item:hover {
            background-color: #f5f5f5;
        }

        /* 复选框样式 */
        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #7986cb;
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            margin-top: 2px;
            transition: all 0.2s ease;
        }

        input[type="checkbox"]:checked {
            background-color: #3f51b5;
            border-color: #3f51b5;
        }

        input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 6px;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* 底栏与按钮 */
        .button-bar {
            display: flex;
            gap: 12px;
            justify-content: center;
            padding-top: 12px;
            border-top: 1px solid #eee;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 120px;
            max-width: 180px;
            padding: 10px 16px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: #424242;
        }

        .btn-secondary:hover {
            background-color: #d5d5d5;
        }

        .btn-primary {
            background-color: #3f51b5;
            color: white;
        }

        .btn-primary:hover {
            background-color: #303f9f;
        }

        .btn-danger {
            background-color: #e53935;
            color: white;
        }

        .btn-danger:hover {
            background-color: #c62828;
        }

        .btn-success {
            background-color: #43a047;
            color: white;
        }

        .btn-success:hover {
            background-color: #2e7d32;
        }

        .btn-info {
            background-color: #0288d1;
            color: white;
        }

        .btn-info:hover {
            background-color: #0277bd;
        }

        /* 第二页：练习页样式 */
        .practice-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 16px;
        }

        .content-display {
            flex: 1;
            background-color: #f9fbe7;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.03);
            text-align: center;
        }

        .chapter-tag {
            font-size: 0.9rem;
            color: #827717;
            background-color: #f0f4c3;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-weight: bold;
        }

        .paragraph-text {
            font-size: clamp(18px, 3.5vw, 26px);
            line-height: 1.8;
            color: #212121;
            text-align: justify;
            word-break: break-all;
        }

        /* 被挖空的字样式 */
        .blank-char {
            display: inline-block;
            min-width: 1.5em;
            border-bottom: 3px solid #e53935;
            color: #e53935;
            font-weight: bold;
            text-align: center;
            padding: 0 4px;
            margin: 0 2px;
            background-color: #ffebee;
            border-radius: 4px;
        }

        /* 揭晓答案后的字样式 */
        .revealed-char {
            color: #43a047;
            border-bottom-color: #43a047;
            background-color: #e8f5e9;
        }

        .controls-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-shrink: 0;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #3f51b5;
            transition: width 0.3s ease;
        }

        .stats-board {
            display: flex;
            justify-content: space-around;
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
        }

        .stat-correct { color: #43a047; }
        .stat-wrong { color: #e53935; }
        .stat-total { color: #757575; }

        .action-row {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        @media (min-width: 768px) {
            .app-card {
                height: 80vh;
            }
            .paragraph-text {
                padding: 0 20px;
            }
        }

        .loading-text {
            text-align: center;
            color: #666;
            font-size: 1.1rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <!-- 第一页：选择页 -->
        <div id="page-select" class="page active">
            <div class="page-title">《论语》考察内容选择</div>
            <div id="tree-container" class="tree-container">
                <div class="loading-text">正在加载 lunyu.txt 内容...</div>
            </div>
            <div class="button-bar">
                <button class="btn btn-secondary" onclick="resetSelection()">重置勾选</button>
                <button class="btn btn-primary" onclick="startPractice()">开始练习</button>
            </div>
        </div>

        <!-- 第二页：练习页 -->
        <div id="page-practice" class="page">
            <div class="practice-container">
                <div class="content-display">
                    <div id="display-chapter" class="chapter-tag">章节名称</div>
                    <div id="display-text" class="paragraph-text">准备开始...</div>
                </div>

                <div class="controls-area">
                    <div class="progress-bar-container">
                        <div id="progress-fill" class="progress-bar-fill"></div>
                    </div>

                    <div class="stats-board">
                        <div>正确: <span id="stat-correct" class="stat-correct">0</span></div>
                        <div>错误: <span id="stat-wrong" class="stat-wrong">0</span></div>
                        <div>剩余: <span id="stat-remaining" class="stat-total">0</span></div>
                    </div>

                    <div class="action-row">
                        <button class="btn btn-success" onclick="recordAnswer(true)">正确 (✓)</button>
                        <button class="btn btn-danger" onclick="recordAnswer(false)">错误 (✕)</button>
                    </div>

                    <div class="button-bar">
                        <button class="btn btn-info" onclick="toggleAnswer()">显示/隐藏答案</button>
                        <button class="btn btn-secondary" onclick="backToSelect()">重新选择</button>
                        <button class="btn btn-primary" onclick="nextQuestion()">下一个</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let parsedData = { book: "论语", chapters: [] };
        let selectedParagraphs = [];
        let practiceQueue = [];
        let currentIndex = 0;
        let stats = { correct: 0, wrong: 0 };
        let currentTargetChar = "";
        let isAnswerRevealed = false;

        document.addEventListener("DOMContentLoaded", () => {
            fetchLunyuText();
        });

        // 1. 读取 lunyu.txt (包含时间戳参数防 GitHub CDN 缓存)
        async function fetchLunyuText() {
            const treeContainer = document.getElementById('tree-container');
            try {
                const response = await fetch(`lunyu.txt?v=${new Date().getTime()}`);
                if (!response.ok) {
                    throw new Error(`无法获取文件，状态码: ${response.status}`);
                }
                const text = await response.text();
                parseLunyuFormat(text);
                renderSelectionTree();
            } catch (err) {
                console.error(err);
                treeContainer.innerHTML = `<div class="loading-text" style="color:#e53935;">
                    读取 lunyu.txt 失败！<br>请确保 html 与 lunyu.txt 在同一目录下，且通过 HTTP 服务访问。
                </div>`;
            }
        }

        // 解析文本格式
        function parseLunyuFormat(rawText) {
            const bookMatch = rawText.match(/<book>(.*?)<\/book>/s);
            if (bookMatch) {
                parsedData.book = bookMatch[1].trim();
            }

            const contentMatch = rawText.match(/<content>([\s\S]*?)<\/content>/s);
            const contentText = contentMatch ? contentMatch[1] : rawText;

            const lines = contentText.split('\n');
            let currentChapter = null;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (/^[\u4e00-\u9fa5]+第[一二三四五六七八九十]+$/.test(trimmed)) {
                    currentChapter = {
                        title: trimmed,
                        paragraphs: []
                    };
                    parsedData.chapters.push(currentChapter);
                } else if (currentChapter) {
                    currentChapter.paragraphs.push(trimmed);
                }
            });
        }

        // 2. 渲染树形列表（添加折叠功能）
        function renderSelectionTree() {
            const container = document.getElementById('tree-container');
            container.innerHTML = '';

            const bookDiv = document.createElement('div');
            bookDiv.className = 'book-item';
            
            // 书名头（点击可折叠全书）
            const bookHeader = document.createElement('div');
            bookHeader.className = 'book-header';
            bookHeader.innerHTML = `<span class="toggle-icon" id="book-icon">▼</span><span>${parsedData.book}</span>`;
            
            const chapterList = document.createElement('div');
            chapterList.className = 'chapter-list';
            chapterList.id = 'book-chapter-list';

            bookHeader.onclick = () => {
                const isCollapsed = chapterList.classList.toggle('collapsed');
                document.getElementById('book-icon').textContent = isCollapsed ? '▶' : '▼';
            };

            bookDiv.appendChild(bookHeader);

            parsedData.chapters.forEach((chap, cIdx) => {
                const chapDiv = document.createElement('div');
                chapDiv.className = 'chapter-item';

                // 章节标头
                const chapHeader = document.createElement('div');
                chapHeader.className = 'chapter-header';

                const toggleIcon = document.createElement('span');
                toggleIcon.className = 'toggle-icon';
                toggleIcon.textContent = '▼';
                toggleIcon.id = `chap-icon-${cIdx}`;

                const chapCheckbox = document.createElement('input');
                chapCheckbox.type = 'checkbox';
                chapCheckbox.id = `chap-${cIdx}`;
                chapCheckbox.onclick = (e) => e.stopPropagation(); // 阻止冒泡，避免触发折叠
                chapCheckbox.onchange = (e) => toggleChapter(cIdx, e.target.checked);

                const chapLabel = document.createElement('span');
                chapLabel.textContent = chap.title;

                chapHeader.appendChild(toggleIcon);
                chapHeader.appendChild(chapCheckbox);
                chapHeader.appendChild(chapLabel);

                // 段落列表
                const paraList = document.createElement('div');
                paraList.className = 'paragraph-list';
                paraList.id = `para-list-${cIdx}`;

                // 点击章节标题展开/收起段落
                chapHeader.onclick = (e) => {
                    if (e.target === chapCheckbox) return;
                    const isCollapsed = paraList.classList.toggle('collapsed');
                    toggleIcon.textContent = isCollapsed ? '▶' : '▼';
                };

                chap.paragraphs.forEach((para, pIdx) => {
                    const paraItem = document.createElement('div');
                    paraItem.className = 'paragraph-item';

                    const paraCheckbox = document.createElement('input');
                    paraCheckbox.type = 'checkbox';
                    paraCheckbox.id = `para-${cIdx}-${pIdx}`;
                    paraCheckbox.className = `p-check-${cIdx}`;
                    paraCheckbox.dataset.chapIndex = cIdx;
                    paraCheckbox.dataset.paraIndex = pIdx;
                    paraCheckbox.onchange = () => updateChapterCheckbox(cIdx);

                    const paraLabel = document.createElement('label');
                    paraLabel.htmlFor = `para-${cIdx}-${pIdx}`;
                    const shortText = para.length > 25 ? para.substring(0, 25) + '...' : para;
                    paraLabel.textContent = `${pIdx + 1}. ${shortText}`;
                    paraLabel.style.cursor = 'pointer';

                    paraItem.appendChild(paraCheckbox);
                    paraItem.appendChild(paraLabel);
                    paraList.appendChild(paraItem);
                });

                chapDiv.appendChild(chapHeader);
                chapDiv.appendChild(paraList);
                chapterList.appendChild(chapDiv);
            });

            bookDiv.appendChild(chapterList);
            container.appendChild(bookDiv);
        }

        // 章节全选/反选
        function toggleChapter(cIdx, isChecked) {
            const checkboxes = document.querySelectorAll(`.p-check-${cIdx}`);
            checkboxes.forEach(cb => cb.checked = isChecked);
        }

        function updateChapterCheckbox(cIdx) {
            const chapCb = document.getElementById(`chap-${cIdx}`);
            const checkboxes = Array.from(document.querySelectorAll(`.p-check-${cIdx}`));
            chapCb.checked = checkboxes.every(cb => cb.checked);
        }

        function resetSelection() {
            const checkboxes = document.querySelectorAll('#tree-container input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = false);
        }

        // 3. 开始练习
        function startPractice() {
            selectedParagraphs = [];
            const checkboxes = document.querySelectorAll('#tree-container input[type="checkbox"][id^="para-"]');
            
            checkboxes.forEach(cb => {
                if (cb.checked) {
                    const cIdx = cb.dataset.chapIndex;
                    const pIdx = cb.dataset.paraIndex;
                    selectedParagraphs.push({
                        chapterTitle: parsedData.chapters[cIdx].title,
                        text: parsedData.chapters[cIdx].paragraphs[pIdx]
                    });
                }
            });

            if (selectedParagraphs.length === 0) {
                alert('请至少勾选一个段落！');
                return;
            }

            practiceQueue = [...selectedParagraphs];
            currentIndex = 0;
            stats = { correct: 0, wrong: 0 };

            document.getElementById('page-select').classList.remove('active');
            document.getElementById('page-practice').classList.add('active');

            renderCurrentQuestion();
        }

        // 4. 渲染题目：随机抽取汉字挖空
        function renderCurrentQuestion() {
            if (currentIndex >= practiceQueue.length) {
                alert(`练习完成！\n正确: ${stats.correct} 次\n错误: ${stats.wrong} 次`);
                backToSelect();
                return;
            }

            isAnswerRevealed = false;
            const current = practiceQueue[currentIndex];
            const originalText = current.text;

            // 查找所有汉字的位置索引（排除标点符号、空格、英文字母及数字）
            const chineseCharRegex = /[\u4e00-\u9fa5]/;
            const validIndices = [];

            for (let i = 0; i < originalText.length; i++) {
                if (chineseCharRegex.test(originalText[i])) {
                    validIndices.push(i);
                }
            }

            document.getElementById('display-chapter').textContent = current.chapterTitle;

            if (validIndices.length === 0) {
                // 如果没有可挖空的汉字，直接展示原文
                currentTargetChar = "";
                document.getElementById('display-text').textContent = originalText;
            } else {
                // 随机抽取一个汉字索引
                const randomIndex = validIndices[Math.floor(Math.random() * validIndices.length)];
                currentTargetChar = originalText[randomIndex];

                // 替换抽中的汉字为下划线挖空元素
                const textBefore = originalText.substring(0, randomIndex);
                const textAfter = originalText.substring(randomIndex + 1);

                document.getElementById('display-text').innerHTML = 
                    `${escapeHtml(textBefore)}<span id="blank-element" class="blank-char">&nbsp;?&nbsp;</span>${escapeHtml(textAfter)}`;
            }

            // 更新进度与统计
            const total = practiceQueue.length;
            const progress = (currentIndex / total) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;

            document.getElementById('stat-correct').textContent = stats.correct;
            document.getElementById('stat-wrong').textContent = stats.wrong;
            document.getElementById('stat-remaining').textContent = total - currentIndex;
        }

        // 切换答案显示状态
        function toggleAnswer() {
            const blankEl = document.getElementById('blank-element');
            if (!blankEl || !currentTargetChar) return;

            if (!isAnswerRevealed) {
                blankEl.textContent = currentTargetChar;
                blankEl.classList.add('revealed-char');
                isAnswerRevealed = true;
            } else {
                blankEl.innerHTML = '&nbsp;?&nbsp;';
                blankEl.classList.remove('revealed-char');
                isAnswerRevealed = false;
            }
        }

        function recordAnswer(isCorrect) {
            if (isCorrect) {
                stats.correct++;
            } else {
                stats.wrong++;
            }
            nextQuestion();
        }

        function nextQuestion() {
            currentIndex++;
            renderCurrentQuestion();
        }

        function backToSelect() {
            document.getElementById('page-practice').classList.remove('active');
            document.getElementById('page-select').classList.add('active');
        }

        // 转义 HTML 字符防止注入
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
