<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽卡认字</title>
    <!-- PWA 配置 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3f51b5">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2232/2232688.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }
        header {
            text-align: center;
            margin-bottom: 16px;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 1.8rem;
            color: #1a237e;
            margin-bottom: 8px;
        }
        .mode-tag {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: bold;
            color: #f44336;
            background-color: #ffebee;
            border: 1px solid #ffcdd2;
            padding: 2px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .stats {
            font-size: 0.9rem;
            color: #666;
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 10px;
        }
        /* 进度条样式 */
        .progress-container {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #4caf50;
            transition: width 0.3s ease;
        }
        .progress-bar.error-mode {
            background-color: #f44336;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            height: 320px;
            perspective: 1000px;
            margin-bottom: 20px;
            margin-top: 10px;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            border-radius: 16px;
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }
        .card-front {
            border: 2px solid #3f51b5;
        }
        .card-back {
            transform: rotateY(180deg);
            background: #fafafa;
            border: 2px solid #4caf50;
        }
        
        /* 正确与错误计数样式 */
        .card-score {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .score-correct { color: #4caf50; }
        .score-wrong { color: #f44336; margin-left: 8px; }

        .char {
            font-size: 4.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .hint {
            font-size: 0.85rem;
            color: #999;
        }
        .context-sentence {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #333;
            margin-bottom: 12px;
            word-break: break-all;
        }
        .highlight {
            color: #e91e63;
            font-weight: bold;
            font-size: 1.4rem;
            text-decoration: underline;
        }
        .btn-group {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 400px;
        }
        button {
            flex: 1;
            padding: 14px 0;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-know {
            background-color: #4caf50;
            color: white;
        }
        .btn-know:hover { background-color: #43a047; }
        .btn-forget {
            background-color: #f44336;
            color: white;
        }
        .btn-forget:hover { background-color: #e53935; }
        .btn-restart {
            background-color: #3f51b5;
            color: white;
            margin-top: 16px;
        }
        .btn-restart:hover { background-color: #303f9f; }
        .finish-container {
            text-align: center;
            margin-top: 60px;
            width: 100%;
            max-width: 400px;
        }
        .finish-container h2 {
            color: #2c3e50;
            margin-bottom: 12px;
        }
        .loading {
            font-size: 1.2rem;
            color: #666;
            margin-top: 100px;
        }
    </style>
</head>
<body>

    <header>
        <h1>抽卡认字</h1>
        <div id="mode-tag-container"></div>
        <div class="stats">
            <span>总字数: <strong id="total-count">0</strong></span>
            <span>待学习: <strong id="review-count">0</strong></span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </header>

    <div id="app" class="loading">正在加载文本数据...</div>

    <script>
        let allCards = [];         // 完整卡片数据备份
        let currentQueue = [];     // 当前轮次的卡片队列
        let wrongQueue = [];       // 本轮记录的错字队列（去重）
        let isErrorMode = false;   // 是否处于错字重练模式
        let totalInCurrentRound = 0; // 当前轮初始卡片数

        // 初始化加载数据
        async function init() {
            try {
                const response = await fetch('./lunyu.txt');
                if (!response.ok) throw new Error('无法读取文本文件');
                const text = await response.text();
                
                processText(text);
                if (allCards.length === 0) {
                    document.getElementById('app').innerHTML = '文本解析为空，请检查文件。';
                    return;
                }
                
                startNewPractice();
            } catch (err) {
                console.error(err);
                document.getElementById('app').innerHTML = '加载失败，请确保本地已放置 lunyu.txt。';
            }
        }

        // 解析文本
        function processText(text) {
            const rawSentences = text.split(/[。！？；\n\r]/);
            const cleanSentences = rawSentences
                .map(s => s.trim().replace(/[^\u4e00-\u9fa5]/g, ''))
                .filter(s => s.length > 0);

            const cardMap = new Map();

            cleanSentences.forEach(sentence => {
                for (let char of sentence) {
                    if (!cardMap.has(char)) {
                        cardMap.set(char, {
                            char: char,
                            sentences: [sentence],
                            correctCount: 0,
                            wrongCount: 0
                        });
                    } else {
                        const data = cardMap.get(char);
                        if (data.sentences.length < 3 && !data.sentences.includes(sentence)) {
                            data.sentences.push(sentence);
                        }
                    }
                }
            });

            allCards = Array.from(cardMap.values());
        }

        // 重新开启一次练习（与上一次练习结果无关）
        function startNewPractice() {
            // 重置所有卡片的答题数据
            allCards.forEach(card => {
                card.correctCount = 0;
                card.wrongCount = 0;
            });

            // 洗牌
            currentQueue = [...allCards];
            shuffle(currentQueue);

            wrongQueue = [];
            isErrorMode = false;
            totalInCurrentRound = currentQueue.length;

            renderCardUI();
            updateHeader();
            showNextCard();
        }

        // 进入错字重练模式
        function startErrorPractice() {
            currentQueue = [...wrongQueue];
            shuffle(currentQueue);
            wrongQueue = [];
            isErrorMode = true;
            totalInCurrentRound = currentQueue.length;

            renderCardUI();
            updateHeader();
            showNextCard();
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 渲染卡片界面结构（认识在左，不认识在右）
        function renderCardUI() {
            const app = document.getElementById('app');
            app.className = '';
            app.innerHTML = `
                <div class="card-container">
                    <div class="card" id="card" onclick="flipCard()">
                        <div class="card-face card-front">
                            <div class="card-score" id="score-front">正确: 0 错误: 0</div>
                            <div class="char" id="card-char">-</div>
                            <div class="hint">点击卡片翻面查看释义与例句</div>
                        </div>
                        <div class="card-face card-back">
                            <div class="card-score" id="score-back">正确: 0 错误: 0</div>
                            <div class="context-sentence" id="card-sentence"></div>
                        </div>
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn-know" onclick="handleResult(true)">认识</button>
                    <button class="btn-forget" onclick="handleResult(false)">不认识</button>
                </div>
            `;
        }

        function flipCard() {
            const card = document.getElementById('card');
            card.classList.toggle('flipped');
        }

        // 刷新顶部统计和进度条
        function updateHeader() {
            const tagContainer = document.getElementById('mode-tag-container');
            const progressBar = document.getElementById('progress-bar');
            
            if (isErrorMode) {
                tagContainer.innerHTML = `<span class="mode-tag">错字重练</span>`;
                progressBar.classList.add('error-mode');
            } else {
                tagContainer.innerHTML = '';
                progressBar.classList.remove('error-mode');
            }

            document.getElementById('total-count').textContent = totalInCurrentRound;
            document.getElementById('review-count').textContent = currentQueue.length;

            // 计算进度百分比
            const completed = totalInCurrentRound - currentQueue.length;
            const progress = totalInCurrentRound > 0 ? (completed / totalInCurrentRound) * 100 : 0;
            progressBar.style.width = `${progress}%`;
        }

        // 显示下一张卡片
        function showNextCard() {
            if (currentQueue.length === 0) {
                // 本轮结束，判断是否有错题
                if (wrongQueue.length > 0) {
                    startErrorPractice();
                } else {
                    showFinishUI();
                }
                return;
            }

            const currentCard = currentQueue[0];
            const cardEl = document.getElementById('card');
            
            cardEl.classList.remove('flipped');

            setTimeout(() => {
                // 第一行显示正确/错误次数
                const scoreText = `<span class="score-correct">正确: ${currentCard.correctCount}</span><span class="score-wrong">错误: ${currentCard.wrongCount}</span>`;
                document.getElementById('score-front').innerHTML = scoreText;
                document.getElementById('score-back').innerHTML = scoreText;

                document.getElementById('card-char').textContent = currentCard.char;
                
                const rawSentence = currentCard.sentences[0] || '';
                const highlightedSentence = rawSentence.replace(
                    new RegExp(currentCard.char, 'g'),
                    `<span class="highlight">${currentCard.char}</span>`
                );
                document.getElementById('card-sentence').innerHTML = `“${highlightedSentence}”`;
            }, cardEl.classList.contains('flipped') ? 300 : 0);

            updateHeader();
        }

        // 答题逻辑
        function handleResult(known) {
            if (currentQueue.length === 0) return;

            const currentCard = currentQueue[0];

            if (known) {
                currentCard.correctCount++;
                currentQueue.shift(); // 移出当前队列
            } else {
                currentCard.wrongCount++;
                // 放入错题集合
                if (!wrongQueue.includes(currentCard)) {
                    wrongQueue.push(currentCard);
                }
                // 不认识时将卡片移到队列末尾继续练习
                const item = currentQueue.shift();
                currentQueue.push(item);
            }

            showNextCard();
        }

        // 完成所有练习页面
        function showFinishUI() {
            document.getElementById('mode-tag-container').innerHTML = '';
            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('review-count').textContent = '0';

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="finish-container">
                    <h2>🎉 恭喜！已通关所有汉字</h2>
                    <button class="btn-restart" onclick="startNewPractice()">再练一次</button>
                </div>
            `;
        }

        init();

        // Service Worker 自动注册与后台更新
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((registration) => {
                    registration.onupdatefound = () => {
                        const installingWorker = registration.installing;
                        if (installingWorker == null) return;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                window.location.reload();
                            }
                        };
                    };
                }).catch((err) => console.error('SW Failed:', err));
            });

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }
    </script>
</body>
</html>
